<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vigoAI — Женя</title>
    <style>
        /* Базовый стиль в духе темной темы */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Шапка */
        header {
            padding: 20px;
            text-align: center;
            background: #1e293b;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            color: #38bdf8;
            font-size: 24px;
        }

        /* Окно чата */
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Пузыри сообщений */
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.4;
        }

        .user-message {
            align-self: flex-end;
            background-color: #38bdf8;
            color: #0f172a;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: #334155;
            color: #f8fafc;
            border-bottom-left-radius: 2px;
        }

        /* Поле ввода и кнопка */
        .input-area {
            padding: 20px;
            background: #1e293b;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            padding: 12px 24px;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0ea5e9;
            transform: translateY(-2px);
        }

        /* Скроллбар */
        #chat-window::-webkit-scrollbar {
            width: 6px;
        }
        #chat-window::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>vigoAI: Женя</h1>
        <small>Создатель: Ilyukha</small>
    </header>

    <div id="chat-window">
        <div class="message ai-message">Привет, Илья! Я готов. Чего делать будем?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Напиши Жене..." autocomplete="off">
        <button id="send-btn">Отправить</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
